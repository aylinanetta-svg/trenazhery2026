<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тигролови: маршрут утікача</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Один візуальний світ: нічна зимова тайга. Сніжні картки на хвойно-синьому тлі, тигровий помаранчевий — акцент і «сліди». Маршрут станцій — стежка зліва направо. */
:root{
  --night:#0f2229;
  --spruce:#173842;
  --spruce-2:#1f4752;
  --snow:#f1f5f3;
  --frost:#a9c2be;
  --ink:#16262b;
  --ink-soft:#4b5f63;
  --tiger:#f08a24;
  --tiger-deep:#c96410;
  --good:#3fa36c;
  --good-bg:#e3f4ea;
  --bad:#d4523f;
  --bad-bg:#fbe7e3;
  --display:"Unbounded", "Arial Black", system-ui, sans-serif;
  --body:"Nunito", "Segoe UI", system-ui, sans-serif;
  --radius:14px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:var(--night);
  background-image:
    radial-gradient(1200px 500px at 85% -10%, #24525c 0%, transparent 60%),
    radial-gradient(900px 400px at -10% 110%, #1b3f48 0%, transparent 60%);
  background-attachment:fixed;
  color:var(--snow);
  font-family:var(--body);
  font-size:17px;
  line-height:1.55;
}
#snow{position:fixed;inset:0;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:880px;margin:0 auto;padding:24px 16px 64px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:clamp(28px,5vw,44px);font-weight:800;letter-spacing:-.01em}
h2{font-size:clamp(20px,3.4vw,28px);font-weight:700}
h3{font-size:18px;font-weight:700}
p{margin:0}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--tiger);outline-offset:2px}

/* Верхня панель */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:15px;color:var(--frost)}
.brand svg{width:26px;height:26px}
.tracks{display:flex;align-items:center;gap:8px;background:var(--spruce);border:1px solid #2b5560;padding:6px 14px;border-radius:999px;font-weight:800;font-variant-numeric:tabular-nums}
.tracks svg{width:20px;height:20px}

/* Картки */
.card{background:var(--snow);color:var(--ink);border-radius:var(--radius);padding:24px;box-shadow:0 12px 30px rgba(0,0,0,.28)}
.card + .card{margin-top:16px}
.muted{color:var(--ink-soft)}
.eyebrow{font-family:var(--display);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--tiger-deep);font-weight:700;margin-bottom:8px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* Кнопки */
.btn{border:0;border-radius:999px;padding:12px 22px;font-weight:800;background:var(--tiger);color:#1b1105;transition:transform .12s, background .12s}
.btn:hover{background:#ff9a35}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid #c9d6d3}
.btn.ghost:hover{border-color:var(--tiger)}
.btn.dark-ghost{background:transparent;color:var(--snow);border:2px solid #3b6670}
.btn.dark-ghost:hover{border-color:var(--tiger)}

/* Старт */
.hero{padding:8px 0 22px}
.hero .lead{color:var(--frost);max-width:62ch;margin-top:12px;font-size:18px}
.topic{margin-top:16px;padding:12px 16px;border-left:4px solid var(--tiger);background:rgba(255,255,255,.05);border-radius:0 10px 10px 0;max-width:68ch;color:var(--snow)}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:15px}
input[type=text]{font:inherit;padding:12px 14px;border-radius:10px;border:2px solid #c9d6d3;background:#fff;color:var(--ink);width:100%}
input[type=text]:focus{border-color:var(--tiger);outline:none}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{border:2px solid #c9d6d3;background:#fff;color:var(--ink);border-radius:999px;padding:8px 16px;font-weight:700}
.seg button[aria-pressed=true]{border-color:var(--tiger);background:#fff3e6}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.rule{background:#e7eeec;border-radius:12px;padding:12px 14px;font-size:15px}
.rule b{display:block;font-family:var(--display);font-size:13px;margin-bottom:2px}

/* Мапа */
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.stop{position:relative;text-align:left;border:0;border-radius:var(--radius);padding:18px 18px 16px;background:var(--spruce);color:var(--snow);border:1px solid #2b5560;display:flex;flex-direction:column;gap:6px;min-height:150px}
.stop:hover:not([disabled]){border-color:var(--tiger)}
.stop[disabled]{opacity:.5;cursor:not-allowed}
.stop .num{font-family:var(--display);font-size:13px;color:var(--frost)}
.stop .name{font-family:var(--display);font-weight:700;font-size:19px}
.stop .sub{font-size:14px;color:var(--frost)}
.stop .state{margin-top:auto;font-size:14px;font-weight:800}
.stop.done{background:#1d4a3a;border-color:#2f7a58}
.stop.done .state{color:#8be0b2}
.stop.current{border:2px solid var(--tiger)}
.stop.current .state{color:var(--tiger)}
.stop.exam{background:linear-gradient(135deg,#3a2510,#5a3510);border-color:#8a5520}
.progress{height:10px;background:#0b1a1f;border-radius:999px;overflow:hidden;border:1px solid #2b5560}
.progress > i{display:block;height:100%;background:var(--tiger);border-radius:999px;transition:width .4s}

/* Текст уривка */
details.text{background:#fbf7ef;border:1px solid #eadfca;border-radius:12px;padding:0}
details.text summary{list-style:none;cursor:pointer;padding:14px 18px;font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:12px}
details.text summary::-webkit-details-marker{display:none}
details.text summary .hint{font-weight:600;font-size:14px;color:var(--ink-soft)}
details.text summary::after{content:"Сховати";font-size:13px;font-weight:800;color:var(--tiger-deep);white-space:nowrap}
details.text:not([open]) summary::after{content:"Показати"}
.text-body{padding:0 18px 18px;max-height:420px;overflow:auto;font-size:16.5px;line-height:1.65}
.text-body p + p{margin-top:10px}
.text-body h4{font-family:var(--display);font-size:14px;margin:14px 0 6px;color:var(--tiger-deep)}
.text-body .q{font-style:italic}
.source{font-size:13px;color:var(--ink-soft);margin-top:12px}

/* Питання */
.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.qcount{font-size:14px;font-weight:800;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.qtext{font-size:20px;font-weight:800;line-height:1.35}
.quote{font-style:italic;background:#eef3f1;border-left:4px solid var(--tiger);padding:10px 14px;border-radius:0 10px 10px 0}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:2px solid #cfdcd9;background:#fff;color:var(--ink);border-radius:12px;padding:12px 16px;font-weight:700;display:flex;gap:12px;align-items:flex-start}
.opt:hover:not([disabled]){border-color:var(--tiger)}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#e7eeec;font-family:var(--display);font-size:13px}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.right .k{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.feedback{border-radius:12px;padding:12px 16px;font-size:16px}
.feedback.ok{background:var(--good-bg);border:1px solid #b7e0c7}
.feedback.no{background:var(--bad-bg);border:1px solid #f1c3ba}
.feedback b{display:block;margin-bottom:2px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}

/* Сортування */
.sort-item{border:2px solid #cfdcd9;border-radius:12px;padding:12px 14px;background:#fff;display:flex;flex-direction:column;gap:10px}
.sort-item .t{font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid #cfdcd9;background:#f5f8f7;color:var(--ink);border-radius:999px;padding:6px 14px;font-weight:700;font-size:15px}
.chip[aria-pressed=true]{border-color:var(--tiger);background:#fff3e6}
.sort-item.right{border-color:var(--good);background:var(--good-bg)}
.sort-item.wrong{border-color:var(--bad);background:var(--bad-bg)}

/* Послідовність */
.order-list{display:flex;flex-direction:column;gap:8px;padding:0;margin:0;list-style:none}
.order-item{display:flex;align-items:center;gap:10px;border:2px solid #cfdcd9;background:#fff;border-radius:12px;padding:10px 12px}
.order-item .n{flex:none;width:30px;height:30px;border-radius:50%;background:#e7eeec;display:grid;place-items:center;font-family:var(--display);font-size:13px}
.order-item .t{flex:1;font-weight:700}
.order-item .mv{display:flex;gap:6px}
.mv button{width:38px;height:38px;border-radius:10px;border:2px solid #cfdcd9;background:#f5f8f7;color:var(--ink);font-weight:800;font-size:18px;line-height:1}
.mv button:hover:not([disabled]){border-color:var(--tiger)}
.mv button[disabled]{opacity:.35;cursor:default}
.order-item.right{border-color:var(--good);background:var(--good-bg)}
.order-item.wrong{border-color:var(--bad);background:var(--bad-bg)}

/* Множинний вибір */
.check{display:flex;gap:12px;align-items:center;border:2px solid #cfdcd9;background:#fff;border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--tiger);flex:none}
.check.right{border-color:var(--good);background:var(--good-bg)}
.check.wrong{border-color:var(--bad);background:var(--bad-bg)}

/* Відповідність */
.match-row{display:grid;grid-template-columns:1fr minmax(220px,300px);gap:12px;align-items:center;border:2px solid #cfdcd9;background:#fff;border-radius:12px;padding:10px 14px}
.match-row .t{font-weight:700}
.match-row select{font:inherit;padding:9px 10px;border-radius:10px;border:2px solid #cfdcd9;background:#f8faf9;color:var(--ink);width:100%}
.match-row.right{border-color:var(--good);background:var(--good-bg)}
.match-row.wrong{border-color:var(--bad);background:var(--bad-bg)}
@media (max-width:560px){.match-row{grid-template-columns:1fr}}

.readbox{background:#fff3e6;border:1px solid #f4cfa6;border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px}
.readbox .book{font-family:var(--display);font-size:22px;font-weight:800;color:var(--ink);line-height:1.3}
.readbox a{color:var(--tiger-deep);font-weight:800}
.readbox.done{opacity:.85}
details.text.locked summary{cursor:not-allowed;opacity:.65}
details.text.locked summary::after{content:"Закрито"}
.insight{background:#fff3e6;border:1px solid #f4cfa6;border-radius:12px;padding:14px 16px}
.insight b{font-family:var(--display);font-size:13px;color:var(--tiger-deep);display:block;margin-bottom:4px;letter-spacing:.04em}

/* Результат станції */
.big-score{font-family:var(--display);font-size:44px;font-weight:800;color:var(--tiger-deep);font-variant-numeric:tabular-nums}
.paws{display:flex;gap:4px;flex-wrap:wrap}
.paws svg{width:22px;height:22px}

/* Сертифікат */
#certImg{width:100%;height:auto;border-radius:10px;display:block;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.save-tip{font-size:15px}

.footer-actions{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:6px}
.small{font-size:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (prefers-reduced-motion: reduce){
  *{animation:none !important;transition:none !important}
}
</style>
</head>
<body>
<canvas id="snow" aria-hidden="true"></canvas>
<div class="wrap">
  <div class="topbar">
    <div class="brand"><svg viewBox="0 0 64 64" aria-hidden="true"><use href="#paw"/></svg>Тренажер · 9 клас · Українська література</div>
    <div class="tracks" title="Зібрані тигрячі сліди"><svg viewBox="0 0 64 64" aria-hidden="true"><use href="#paw"/></svg><span id="trackCount">0</span><span class="sr"> тигрячих слідів</span></div>
  </div>
  <main id="app" aria-live="polite"></main>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="paw" viewBox="0 0 64 64">
      <g fill="#f08a24">
        <ellipse cx="32" cy="42" rx="14" ry="12"/>
        <ellipse cx="14" cy="26" rx="6" ry="8" transform="rotate(-20 14 26)"/>
        <ellipse cx="25" cy="15" rx="6" ry="8" transform="rotate(-6 25 15)"/>
        <ellipse cx="39" cy="15" rx="6" ry="8" transform="rotate(6 39 15)"/>
        <ellipse cx="50" cy="26" rx="6" ry="8" transform="rotate(20 50 26)"/>
      </g>
    </symbol>
  </defs>
</svg>

<script>
/* ===================== ТЕКСТИ-ПЕРЕКАЗИ ===================== */
const FULLTEXT = "https://www.ukrlib.com.ua/books/printit.php?tid=30";
const EBOOK = "https://pidruchnik.com/3242-ukr-literatura-9-klas-avramenko-2026.html";
const TEXTS = {
  dragon: {
    pages: "111", what: "розділ перший «Дракон»", chapter: "Розділ перший",
    title: "Розділ перший. «Дракон» — стислий переказ",
    html: `
<p>Ешелон із тисячами в'язнів мчить на схід, на каторгу. Автор порівнює потяг із драконом, що дихає полум'ям і димом.</p>
<p>Потяг часто зупиняється, і щоразу перевіряють, чи на місці один арештант — Григорій Многогрішний. Коли ешелон доїхав до океану, з'ясувалося, що він утік.</p>
<p>Тим самим шляхом мчить інший потяг — розкішний експрес для привілейованих пасажирів, які їдуть на Далекий Схід по пригоди й багатство: уссурійських тигрів, корінь женьшеню.</p>
<p>У цьому експресі їде майор НКВД Медвин. Він дізнається, що втік засуджений на 25 років авіатор Многогрішний, якого Медвин сам два роки допитував і мучив, але не зламав.</p>
<p>Перед утікачем — безмежна тайга. Він біжить на знесилення, їсть корінці та ягоди. Навколо ні сліду людського життя.</p>`
  },
  author: {
    pages: "107–108", what: "життєпис Івана Багряного та рубрику «До речі…»",
    title: "Довідка: автор і герой — стислий переказ",
    html: `
<h4>Іван Багряний (справжнє прізвище — Лозов'ягін)</h4>
<p>Народився 1907 року на Сумщині, біля міста Охтирки, через яке тече річка Ворскла. Навчався в художньо-керамічній школі та в Київському художньому інституті, але диплома не отримав, бо його вважали «політично неблагонадійним». Писав вірші та оповідання.</p>
<p>Після арешту його заслали на три роки на Далекий Схід, у суворий край біля океану. Там він бачив поселення українців, які давно переїхали туди з України. Охоплений тугою за домом, він утік і поїхав на захід, але в Томську його схопили. Потім були три роки табору.</p>
<p>У в'язниці йому пропонували орден, якщо він зречеться товаришів і напише поему про Сталіна. Він відмовився. Під час Другої світової війни переїхав до Львова й написав роман «Звіролови» (1944). Згодом емігрував до Німеччини. Там роман перевидали під назвою «Тигролови». Помер 1963 року в Німеччині.</p>
<h4>Григорій Многогрішний</h4>
<p>Молодий українець, авіатор (льотчик), засуджений на 25 років. Його рід веде початок від гетьмана Дем'яна Многогрішного, якого колись теж заслали до Сибіру. Слідчий Медвин два роки допитував і катував Григорія, але не зламав.</p>
<p>Дорогою на каторгу Григорій утікає з ешелону в тайгу. У маренні йому ввижається рідний край: Ворскла, Дніпро, мати. Згодом він опиняється в родині українців-переселенців Сірків.</p>`
  },
  death: {
    chapter: "Розділ третій", pages: "112–115", what: "розділ третій «Навзаводи зі смертю» (до слів «Напружена та зрадлива тиша нетрів»)",
    title: "Розділ третій. «Навзаводи зі смертю» — стислий переказ",
    html: `
<p>Змучений утікач лежить біля гірської річки, опускає ноги в холодну воду, жадібно п'є. Йому вчувається, що його кличуть на допит, але це лише шумлять пороги.</p>
<p>Між каменями він знаходить старий мисливський ніж, довго відчищає й гострить його. Тепер у нього є зброя. Побачивши у воді своє заросле обличчя, він голиться цим ножем.</p>
<p>Але сили тануть. Він довго бреде тайгою, рахує дні втечі, нарешті лягає під кедрами й думає, що це кінець. У маренні йому ввижається рідне: гаї, поля, Ворскла, Дніпро, мати біля печі.</p>
<p>Раптом лунають постріли й відчайдушний крик «Грицьку!». Григорій вибігає на галявину: величезний ведмідь намагається дістати людину, що сховалася в розколині скелі. Григорій кидається на звіра з ножем і вбиває його. Остання мить, яку він бачить: людина в одязі звіролова біжить до нього. Далі — темрява.</p>
<p>Уночі гірськими стежками мчать троє вершників. В одного щось лежить упоперек сідла: вони везуть пораненого додому.</p>`
  },
  family: {
    chapter: "Розділ четвертий", pages: "115–120", what: "розділ четвертий «Родина тигроловів» і стислий виклад подальших подій на с. 120",
    title: "Розділ четвертий. «Родина тигроловів» — стислий переказ",
    html: `
<p>Григорій приходить до тями в незнайомій хаті. Він певен, що рятував від ведмедя юнака, аж бачить перед собою дівчину, яка насмішкувато з ним розмовляє. Це Наталка. Тут і її брат Грицько, і старі батько та мати.</p>
<p>Почувши, що це «Київський район», Григорій лякається: йому згадується київська в'язниця. Та з'ясовується, що «Київським» називають тутешній край, а Сірки — переселенці з України. Григорій каже, що він із Трипілля, і мати радіє: вони земляки! Вона каже йому: «У сміливих щастя завжди є».</p>
<p>Мати розповідає, як колись давно родина пливла сюди з Одеси через багато морів, як освоювала дикий край і жила великою дружною сім'єю. Цей край переселенці вважали новою Україною й давали селам назви з рідного краю. Але прийшла радянська влада, і все перевернулося.</p>
<p>Мати ніколи не бачила України, але сумує за нею й береже пам'ять про неї. Григорій не хоче її засмучувати й мовчить, що тієї ясної України вже немає. Сірки не розпитують, хто він, і Григорій вдячний їм за це.</p>
<h4>Що було далі (стисло)</h4>
<p>Григорій полює разом із Сірками, дружить із Грицьком і закохується в Наталку, але обоє горді й не признаються. Узимку він заблукав у тайзі, і Наталка з собакою Заливаєм його відшукала. Разом святкують Різдво за українськими звичаями. Григорій для Сірків тепер як рідний син. А на снігу з'являється напис-«привіт» від Медвина: переслідувач поруч.</p>`

const EXAM_PASS = 7;

/* ===================== СТАН ===================== */
const KEY = "tyhrolovy-trainer-v1";
let S = load() || {name:"", gender:"m", cls:"9", done:{}, exam:null};
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)); }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

const app = document.getElementById("app");
const pawSvg = '<svg viewBox="0 0 64 64" aria-hidden="true"><use href="#paw"/></svg>';
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
const LETTERS = ["А","Б","В","Г","Ґ","Д"];
function g(m,f){ return S.gender==="f"?f:m; }

function partMax(p){
  if(p.type==="mc") return p.items.length*2;
  if(p.type==="sort") return p.items.length;
  if(p.type==="order") return p.items.length;
  if(p.type==="multi") return p.opts.length;
  if(p.type==="match") return p.rows.length;
  return 0;
}
function stationMax(st){ return st.parts.reduce((s,p)=>s+partMax(p),0); }
const TOTAL_MAX = STATIONS.reduce((s,st)=>s+stationMax(st),0) + EXAM.length*2;
function totalTracks(){
  let t = Object.values(S.done).reduce((a,b)=>a+b,0);
  if(S.exam && S.exam.passed) t += S.exam.score*2;
  return t;
}
function updateTracks(){ document.getElementById("trackCount").textContent = totalTracks(); }
function stationsDone(){ return STATIONS.filter(st=>st.id in S.done).length; }
function go(view, arg){ window.scrollTo({top:0, behavior:"instant" in window ? "instant":"auto"}); render(view,arg); }

/* ===================== ЕКРАНИ ===================== */
function render(view, arg){
  updateTracks();
  if(view==="start") return renderStart();
  if(view==="map") return renderMap();
  if(view==="station") return renderStation(arg);
  if(view==="exam") return renderExam();
  if(view==="cert") return renderCert();
}

function renderStart(){

  </div>`;
  const nm = document.getElementById("nm");
  document.getElementById("gm").onclick = ()=>{S.gender="m"; save(); renderStart();};

function renderMap(){
  const n = stationsDone();
  const pct = Math.round(((n + (S.exam&&S.exam.passed?1:0)) / (STATIONS.length+1))*100);
  let html = `
  <section class="hero" style="padding-bottom:16px">
    <div class="eyebrow" style="color:var(--tiger)">Маршрут · ${esc(S.name)}</div>
    <h2>Карта тайги</h2>
    <p class="lead" style="font-size:16px">Пройдено ${n} з ${STATIONS.length} станцій. ${n===STATIONS.length? "Іспит тигролова відкрито!" : "Наступна станція чекає."}</p>
    <div class="progress" style="margin-top:14px" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
  </section>
  <div class="map">`;
  STATIONS.forEach((st,i)=>{
    const done = st.id in S.done;
    const open = i===0 || (STATIONS[i-1].id in S.done);
    const cur = open && !done;
    html += `<button class="stop ${done?'done':''} ${cur?'current':''}" data-i="${i}" ${open?'':'disabled'}>
      <span class="num">Станція ${i+1}</span>
      <span class="name">${esc(st.title)}</span>
      <span class="sub">${esc(st.sub)}</span>
      <span class="state">${done? `Пройдено · ${S.done[st.id]} з ${stationMax(st)} слідів` : open? "Вирушити →" : "Закрито"}</span>
    </button>`;
  });
  const examOpen = n===STATIONS.length;
  html += `<button class="stop exam ${S.exam&&S.exam.passed?'done':''}" id="examBtn" ${examOpen?'':'disabled'}>
      <span class="num">Фінал</span>
      <span class="name">Іспит тигролова</span>
      <span class="sub">${EXAM.length} питань без підказок</span>
      <span class="state">${S.exam&&S.exam.passed? `Складено · ${S.exam.score} з ${EXAM.length}` : examOpen? "Скласти іспит →" : "Відкриється після 6 станцій"}</span>
    </button></div>
  <div class="footer-actions" style="margin-top:20px">
    <button class="btn dark-ghost" id="back">Змінити ім'я</button>
    ${S.exam&&S.exam.passed? '<button class="btn" id="toCert">Мій сертифікат</button>' : ''}
  </div>`;
  app.innerHTML = html;
  app.querySelectorAll(".stop[data-i]").forEach(b=> b.onclick = ()=> go("station", +b.dataset.i));
  const eb = document.getElementById("examBtn"); if(examOpen) eb.onclick = ()=> go("exam");
  document.getElementById("back").onclick = ()=> go("start");
  const tc = document.getElementById("toCert"); if(tc) tc.onclick = ()=> go("cert");
}

    </div>
    <details class="text" open>
      <summary><span>Стислий переказ <span class="hint">· ${esc(tx.title.replace(/ — стислий переказ$/,""))}</span></span></summary>
      <div class="text-body">${tx.html}<p class="source">Це лише стислий переказ. Повний текст — у підручнику, с. ${tx.pages}.</p></div>
    </details>
    <div id="task" hidden></div>
  </div>
  <div class="footer-actions" style="margin-top:16px"><button class="btn dark-ghost" id="toMap">← До карти</button></div>`;
  document.getElementById("toMap").onclick = ()=> go("map");
  CUR_TEXT = st.text;
  const task = document.getElementById("task");

  function nextPart(points){
    earned += points;
    partIndex++;
    if(partIndex < st.parts.length) runPart();
    else finish();
  }
  function runPart(){
    const p = st.parts[partIndex];
    const label = `Завдання ${partIndex+1} з ${st.parts.length}${p.name? " · "+esc(p.name) : ""}`;
    if(p.type==="mc") return mcPart(task, p, label, nextPart);
    if(p.type==="sort") return sortPart(task, p, label, nextPart);
    if(p.type==="order") return orderPart(task, p, label, nextPart);
    if(p.type==="multi") return multiPart(task, p, label, nextPart);
    if(p.type==="match") return matchPart(task, p, label, nextPart);
  }
  function finish(){
    const max = stationMax(st);
    const prev = S.done[st.id];
    S.done[st.id] = Math.max(prev||0, earned);
    save(); updateTracks();
    const ratio = earned/max;
    const verdict = ratio>=.9 ? "Блискуче! Справжній слідопит." : ratio>=.7 ? "Добре! Стежку пройдено впевнено." : "Станцію пройдено. Можеш повторити, щоб зібрати більше слідів.";
    const last = i===STATIONS.length-1;
    app.innerHTML = `
    <section class="hero" style="padding-bottom:16px">
      <div class="eyebrow" style="color:var(--tiger)">Станцію ${i+1} пройдено</div>
      <h2>${esc(st.title)}</h2>
    </section>
    <div class="card stack">
      <div class="row" style="justify-content:space-between">
        <div><div class="big-score">${earned} / ${max}</div><div class="muted">тигрячих слідів на цій станції</div></div>
        <div class="paws" aria-hidden="true">${pawSvg.repeat(Math.max(1,Math.round(ratio*8)))}</div>
      </div>
      <p style="font-weight:800;font-size:18px">${verdict}</p>
      <div class="insight"><b>ЧИ ЗНАЄШ ТИ?</b>${esc(st.fact)}</div>
      <div class="row">
        <button class="btn" id="nx">${last? "До іспиту тигролова →" : "Наступна станція →"}</button>
        <button class="btn ghost" id="rp">Пройти ще раз</button>
        <button class="btn ghost" id="mp">Карта</button>
      </div>
    </div>`;
    document.getElementById("nx").onclick = ()=> last ? go("exam") : go("station", i+1);
    document.getElementById("rp").onclick = ()=> go("station", i);
    document.getElementById("mp").onclick = ()=> go("map");
  }
  document.getElementById("readDone").onclick = ()=>{
    const rb = document.getElementById("readbox"); rb.classList.add("done");
    document.getElementById("readDone").remove();
    task.hidden = false; runPart(); task.scrollIntoView({behavior:"smooth", block:"start"});
  };
}
let onMistake = ()=>{};
let CUR_TEXT = "dragon";

/* ---------- Типи завдань ---------- */
function mcPart(el, p, label, done){
  let k = 0, pts = 0;
  const items = p.items.map(it=>{
    const order = shuffle(it.opts.map((_,j)=>j));
    return {...it, order};
  });
  function show(){
    const it = items[k];
    let tries = 0, solved = false;
    el.innerHTML = `
      <div class="stack">
        <div class="qhead"><div class="eyebrow" style="margin:0">${label}</div><div class="qcount">Питання ${k+1} з ${items.length}</div></div>
        <div class="qtext">${esc(it.q)}</div>
        ${it.quote? `<div class="quote">${esc(it.quote)}</div>`:""}
        <div class="opts">${it.order.map((oi,j)=>`<button class="opt" data-oi="${oi}"><span class="k">${LETTERS[j]}</span><span>${esc(it.opts[oi])}</span></button>`).join("")}</div>
        <div id="fb"></div>
      </div>`;
    const fb = el.querySelector("#fb");
    el.querySelectorAll(".opt").forEach(b=> b.onclick = ()=>{
      if(solved) return;
      tries++;
      const oi = +b.dataset.oi;
      if(oi===it.a){
        solved = true;
        const got = tries===1?2:tries===2?1:0;
        pts += got;
        b.classList.add("right");
        el.querySelectorAll(".opt").forEach(x=> x.disabled = true);
        fb.innerHTML = `<div class="feedback ok"><b>${tries===1? "Точно в ціль! +2 сліди" : got? "Так, правильно. +1 слід" : "Правильно, але сліди втрачено"}</b>${esc(it.why)}</div>
          <div class="row" style="margin-top:12px"><button class="btn" id="nq">${k<items.length-1? "Далі →" : "Завершити завдання →"}</button></div>`;
        updateTracksPreview(got);
        const nq = el.querySelector("#nq"); nq.focus();
        nq.onclick = ()=>{ k++; if(k<items.length) show(); else done(pts); };
      } else {
        b.classList.add("wrong","shake"); b.disabled = true;
        onMistake();
        fb.innerHTML = `<div class="feedback no"><b>Не зовсім. Спробуй ще!</b>${it.hint? "Де шукати: підручник, "+esc(it.hint) : "Перечитай уривок у підручнику (с. "+esc(TEXTS[CUR_TEXT].pages)+") або стислий переказ вище."}</div>`;
      }
    });
  }
  show();
}
let previewExtra = 0;
function updateTracksPreview(add){ previewExtra += add; document.getElementById("trackCount").textContent = totalTracks() + previewExtra; }
const _go = go;
go = function(v,a){ previewExtra = 0; _go(v,a); };

function sortPart(el, p, label, done){
  const items = shuffle(p.items.map((it,j)=>({...it, j})));
  const pick = {}; let checked = 0, firstScore = null;
  function draw(){
    el.innerHTML = `
      <div class="stack">
        <div class="eyebrow" style="margin:0">${label}</div>
        <div class="qtext">${esc(p.prompt)}</div>
        <div class="stack" style="gap:10px">${items.map(it=>`
          <div class="sort-item" id="si${it.j}">
            <div class="t">${esc(it.t)}</div>
            <div class="chips" role="group" aria-label="${esc(it.t)}">${p.bins.map((b,bi)=>`<button class="chip" data-j="${it.j}" data-b="${bi}" aria-pressed="${pick[it.j]===bi}">${esc(b)}</button>`).join("")}</div>
          </div>`).join("")}</div>
        <div id="fb"></div>
        <div class="row"><button class="btn" id="chk">Перевірити</button><span class="small muted" id="left"></span></div>
      </div>`;
    el.querySelectorAll(".chip").forEach(c=> c.onclick = ()=>{
      const j=+c.dataset.j, b=+c.dataset.b; pick[j]=b;
      c.parentElement.querySelectorAll(".chip").forEach(x=> x.setAttribute("aria-pressed", x===c));
      const box = document.getElementById("si"+j); box.classList.remove("right","wrong");
      leftCount();
    });
    leftCount();
    el.querySelector("#chk").onclick = check;
  }
  function leftCount(){
    const n = items.filter(it=> pick[it.j]===undefined).length;
    el.querySelector("#left").textContent = n? `Ще не розподілено: ${n}` : "";
    el.querySelector("#chk").disabled = n>0;
  }
  function check(){
    let ok = 0;
    items.forEach(it=>{
      const box = document.getElementById("si"+it.j);
      const r = pick[it.j]===it.b;
      box.classList.toggle("right", r); box.classList.toggle("wrong", !r);
      if(r) ok++;
    });
    checked++;
    if(firstScore===null){ firstScore = ok; updateTracksPreview(ok); }
    const fb = el.querySelector("#fb");
    if(ok===items.length){
      el.querySelectorAll(".chip").forEach(c=> c.disabled = true);
      fb.innerHTML = `<div class="feedback ok"><b>Усе правильно! ${checked===1?"":"(Сліди зараховано за першу перевірку: "+firstScore+")"}</b></div>
        ${p.after? `<div class="insight" style="margin-top:12px"><b>ВИСНОВОК ДОСЛІДНИКА</b>${esc(p.after)}</div>`:""}
        <div class="row" style="margin-top:12px"><button class="btn" id="nq">Далі →</button></div>`;
      el.querySelector("#chk").style.display="none";
      el.querySelector("#nq").onclick = ()=> done(firstScore);
    } else {
      onMistake(); fb.innerHTML = `<div class="feedback no"><b>Правильно ${ok} з ${items.length}.</b>Червоні рядки зміни й перевір ще раз. Перечитай с. 107–108 підручника.</div>`;
    }
  }
  draw();
}

function orderPart(el, p, label, done){
  let cur = shuffle(p.items.map((t,j)=>j));
  while(cur.every((v,j)=>v===j)) cur = shuffle(cur);
  let firstScore = null, checked = 0;
  function draw(marks){
    el.innerHTML = `
      <div class="stack">
        <div class="eyebrow" style="margin:0">${label}</div>
        <div class="qtext">${esc(p.prompt)}</div>
        <ol class="order-list">${cur.map((j,pos)=>`
          <li class="order-item ${marks? (marks[pos]?'right':'wrong') : ''}">
            <span class="n">${pos+1}</span><span class="t">${esc(p.items[j])}</span>
            <span class="mv"><button data-p="${pos}" data-d="-1" aria-label="Вище" ${pos===0?'disabled':''}>↑</button><button data-p="${pos}" data-d="1" aria-label="Нижче" ${pos===cur.length-1?'disabled':''}>↓</button></span>
          </li>`).join("")}</ol>
        <div id="fb"></div>
        <div class="row"><button class="btn" id="chk">Перевірити порядок</button></div>
      </div>`;
    el.querySelectorAll(".mv button").forEach(b=> b.onclick = ()=>{
      const pos=+b.dataset.p, d=+b.dataset.d, t=pos+d;
      [cur[pos],cur[t]]=[cur[t],cur[pos]]; draw();
      const nb = el.querySelector(`.mv button[data-p="${t}"][data-d="${d}"]`) || el.querySelector(`.mv button[data-p="${t}"]`); if(nb && !nb.disabled) nb.focus();
    });
    el.querySelector("#chk").onclick = check;
  }
  function check(){
    const marks = cur.map((j,pos)=> j===pos);
    const ok = marks.filter(Boolean).length;
    checked++;
    if(firstScore===null){ firstScore = ok; updateTracksPreview(ok); }
    draw(marks);
    const fb = el.querySelector("#fb");
    if(ok===cur.length){
      el.querySelectorAll(".mv button").forEach(b=> b.disabled=true);
      el.querySelector("#chk").style.display="none";
      fb.innerHTML = `<div class="feedback ok"><b>Порядок відновлено!</b>Сліди зараховано за першу перевірку: ${firstScore} з ${cur.length}.</div>
        <div class="row" style="margin-top:12px"><button class="btn" id="nq">Далі →</button></div>`;
      el.querySelector("#nq").onclick = ()=> done(firstScore);
    } else {
      onMistake(); fb.innerHTML = `<div class="feedback no"><b>На своєму місці ${ok} з ${cur.length}.</b>Червоні рядки стоять не там. Перечитай розділ у підручнику (с. 112–115).</div>`;
    }
  }
  draw();
}

function multiPart(el, p, label, done){
  const opts = shuffle(p.opts.map((o,j)=>({...o,j})));
  let firstScore = null;
  el.innerHTML = `
    <div class="stack">
      <div class="eyebrow" style="margin:0">${label}</div>
      <div class="qtext">${esc(p.prompt)}</div>
      <div class="stack" style="gap:8px">${opts.map(o=>`<label class="check" id="mc${o.j}"><input type="checkbox" id="cb${o.j}" data-j="${o.j}"><span>${esc(o.t)}</span></label>`).join("")}</div>
      <div id="fb"></div>
      <div class="row"><button class="btn" id="chk">Перевірити</button></div>
    </div>`;
  el.querySelectorAll(".check input").forEach(c=> c.onchange = ()=> c.closest(".check").classList.remove("right","wrong"));
  el.querySelector("#chk").onclick = ()=>{
    let ok=0;
    opts.forEach(o=>{
      const on = document.getElementById("cb"+o.j).checked;
      const r = on===o.ok; if(r) ok++;
      const box = document.getElementById("mc"+o.j);
      box.classList.toggle("right", r && on); box.classList.toggle("wrong", !r);
    });
    if(firstScore===null){ firstScore = ok; updateTracksPreview(ok); }
    const fb = el.querySelector("#fb");
    if(ok===opts.length){
      el.querySelectorAll(".check input").forEach(c=> c.disabled=true);
      el.querySelector("#chk").style.display="none";
      fb.innerHTML = `<div class="feedback ok"><b>Усі ознаки знайдено!</b>Викрадення, втечі, переслідування, таємничість, припущення й розгадування — «двигуни» пригодницького сюжету. Сліди за першу перевірку: ${firstScore} з ${opts.length}.</div>
        <div class="row" style="margin-top:12px"><button class="btn" id="nq">Далі →</button></div>`;
      el.querySelector("#nq").onclick = ()=> done(firstScore);
    } else {
      onMistake(); fb.innerHTML = `<div class="feedback no"><b>Правильних рішень ${ok} з ${opts.length}.</b>Червоним позначено помилки: щось зайве обрано або потрібне пропущено. Перечитай теорію на с. 111.</div>`;
    }
  };
}

function matchPart(el, p, label, done){

  el.innerHTML = `
    <div class="stack">
      <div class="eyebrow" style="margin:0">${label}</div>

          <select id="ms${r.j}"><option value="">— обери ознаку —</option>${p.choices.map((c,ci)=>`<option value="${ci}">${esc(c)}</option>`).join("")}</select>

        <div class="row" style="margin-top:12px"><button class="btn" id="nq">Далі →</button></div>`;

/* ---------- Іспит ---------- */
function renderExam(){
  if(stationsDone()<STATIONS.length){ return go("map"); }
  const qs = shuffle(EXAM).map(it=> ({...it, order: shuffle(it.opts.map((_,j)=>j))}));
  let k=0, score=0;
  app.innerHTML = `
  <section class="hero" style="padding-bottom:16px">
    <div class="eyebrow" style="color:var(--tiger)">Фінал · без підказок і тексту</div>
    <h2>Іспит тигролова</h2>
    <p class="lead" style="font-size:16px">${EXAM.length} питань, одна спроба на кожне. Щоб отримати сертифікат, потрібно ${EXAM_PASS} правильних відповідей.</p>
  </section>
  <div class="card"><div id="task"></div></div>`;
  const el = document.getElementById("task");
  function show(){
    const it = qs[k];
    el.innerHTML = `
      <div class="stack">
        <div class="qhead"><div class="eyebrow" style="margin:0">Іспит</div><div class="qcount">Питання ${k+1} з ${qs.length} · правильних ${score}</div></div>
        <div class="progress"><i style="width:${(k/qs.length)*100}%"></i></div>
        <div class="qtext">${esc(it.q)}</div>
        <div class="opts">${it.order.map((oi,j)=>`<button class="opt" data-oi="${oi}"><span class="k">${LETTERS[j]}</span><span>${esc(it.opts[oi])}</span></button>`).join("")}</div>
        <div id="fb"></div>
      </div>`;
    el.querySelectorAll(".opt").forEach(b=> b.onclick = ()=>{
      const oi=+b.dataset.oi, r = oi===it.a;
      if(r) score++;
      el.querySelectorAll(".opt").forEach(x=>{ x.disabled=true; if(+x.dataset.oi===it.a) x.classList.add("right"); });
      if(!r) b.classList.add("wrong");
      el.querySelector("#fb").innerHTML = `<div class="feedback ${r?'ok':'no'}"><b>${r?"Правильно!":"Помилка."}</b></div>
        <div class="row" style="margin-top:12px"><button class="btn" id="nq">${k<qs.length-1?"Далі →":"Результат →"}</button></div>`;
      const nq = el.querySelector("#nq"); nq.focus();
      nq.onclick = ()=>{ k++; if(k<qs.length) show(); else result(); };
    });
  }
  function result(){
    const passed = score>=EXAM_PASS;
    if(passed){
      if(!S.exam || !S.exam.passed || score>S.exam.score) S.exam = {score, passed:true, date:new Date().toISOString()};
    } else if(!S.exam || !S.exam.passed){
      S.exam = {score, passed:false};
    }
    save(); updateTracks();
    el.innerHTML = `
      <div class="stack">
        <div class="big-score">${score} / ${qs.length}</div>
        <p style="font-weight:800;font-size:19px">${passed? `Іспит складено! ${g("Ти довів","Ти довела")}, що ${g("справжній тигролов","справжня тигроловка")}.` : `Поки що менше ${EXAM_PASS}. Повернися до станцій, перечитай переказ і спробуй знову — питання перемішаються.`}</p>
        <div class="row">
          ${passed? `<button class="btn" id="cert">Отримати сертифікат →</button>` : `<button class="btn" id="again">Спробувати ще раз</button>`}
          <button class="btn ghost" id="mp">Карта</button>
        </div>
      </div>`;
    const c = el.querySelector("#cert"); if(c) c.onclick = ()=> go("cert");
    const a = el.querySelector("#again"); if(a) a.onclick = ()=> go("exam");
    el.querySelector("#mp").onclick = ()=> go("map");
  }
  show();
}

/* ---------- Сертифікат ---------- */
function rank(){
  const r = totalTracks()/TOTAL_MAX;
  if(r>=.9) return g("Майстер тайги","Майстриня тайги");
  if(r>=.75) return g("Досвідчений тигролов","Досвідчена тигроловка");
  return g("Тигролов-дослідник","Тигроловка-дослідниця");
}
function fmtDate(iso){
  const d = iso? new Date(iso) : new Date();
  const m = ["січня","лютого","березня","квітня","травня","червня","липня","серпня","вересня","жовтня","листопада","грудня"];
  return `${d.getDate()} ${m[d.getMonth()]} ${d.getFullYear()} р.`;
}
async function drawCert(){
  const W=1600,H=1130, cv=document.createElement("canvas"); cv.width=W; cv.height=H;
  const x = cv.getContext("2d");
  try{ await Promise.all([document.fonts.load('800 60px Unbounded'), document.fonts.load('700 30px Nunito'), document.fonts.load('400 30px Nunito')]); }catch(e){}
  // фон
  const bg = x.createLinearGradient(0,0,W,H); bg.addColorStop(0,"#fbf7ef"); bg.addColorStop(1,"#f1ece0");
  x.fillStyle=bg; x.fillRect(0,0,W,H);
  // тайга внизу
  x.fillStyle="#173842";
  for(let i=0;i<34;i++){
    const cx = i*50 - 10 + (i%3)*8, h = 60 + ((i*37)%70);
    x.beginPath(); x.moveTo(cx, H-40-h); x.lineTo(cx-34, H-40); x.lineTo(cx+34, H-40); x.closePath(); x.fill();
  }
  x.fillRect(0,H-42,W,42);
  // рамка
  x.strokeStyle="#173842"; x.lineWidth=10; x.strokeRect(36,36,W-72,H-72);
  x.strokeStyle="#f08a24"; x.lineWidth=3; x.strokeRect(58,58,W-116,H-116);
  // лапи
  function paw(px,py,s,rot){ x.save(); x.translate(px,py); x.rotate(rot||0); x.scale(s,s); x.fillStyle="#f08a24";
    const e=(a,b,rx,ry,r)=>{x.beginPath();x.ellipse(a,b,rx,ry,r||0,0,Math.PI*2);x.fill();};
    e(0,10,14,12); e(-18,-6,6,8,-.35); e(-7,-17,6,8,-.1); e(7,-17,6,8,.1); e(18,-6,6,8,.35); x.restore(); }
  [[150,170,.9,-.4],[230,250,.9,-.2],[1450,170,.9,.4],[1370,250,.9,.2]].forEach(a=>paw(...a));
  x.textAlign="center"; x.fillStyle="#16262b";
  x.font='700 26px Nunito'; x.fillStyle="#c96410";
  x.fillText("УКРАЇНСЬКА ЛІТЕРАТУРА · 9 КЛАС", W/2, 140);
  x.fillStyle="#16262b"; x.font='800 96px Unbounded'; x.fillText("СЕРТИФІКАТ", W/2, 250);
  x.font='400 32px Nunito'; x.fillStyle="#4b5f63";
  x.fillText(`засвідчує, що ${g("учень","учениця")} ${S.cls? S.cls+" класу":""}`, W/2, 320);
  // ім'я
  let size=76; x.font=`800 ${size}px Unbounded`;
  while(x.measureText(S.name).width>1200 && size>40){ size-=4; x.font=`800 ${size}px Unbounded`; }
  x.fillStyle="#16262b"; x.fillText(S.name, W/2, 420);
  x.strokeStyle="#f08a24"; x.lineWidth=4; x.beginPath(); x.moveTo(W/2-420,448); x.lineTo(W/2+420,448); x.stroke();
  x.font='400 32px Nunito'; x.fillStyle="#16262b";
  x.fillText(`${g("успішно пройшов","успішно пройшла")} тренажер «Тигролови: маршрут утікача»`, W/2, 510);
  x.fillText(`та ${g("опанував","опанувала")} тему «Автобіографічні події в сюжеті роману`, W/2, 556);
  x.fillText(`Івана Багряного „Тигролови“. Жанрові особливості твору.`, W/2, 602);
  x.fillText(`Пригодницький роман»`, W/2, 648);
  // звання
  x.font='700 28px Nunito'; x.fillStyle="#c96410"; x.fillText("ЗВАННЯ", W/2, 720);
  x.font='800 50px Unbounded'; x.fillStyle="#173842"; x.fillText(rank(), W/2, 780);
  // показники
  x.font='700 30px Nunito'; x.fillStyle="#16262b";
  x.fillText(`Тигрячих слідів: ${totalTracks()} з ${TOTAL_MAX}   ·   Іспит: ${S.exam.score} з ${EXAM.length}   ·   ${fmtDate(S.exam.date)}`, W/2, 850);
  x.font='italic 400 26px Nunito'; x.fillStyle="#4b5f63";
  x.fillText("«У сміливих щастя завжди є»", W/2, 905);
  return cv.toDataURL("image/png");
}
async function renderCert(){
  if(!S.exam || !S.exam.passed){ return go("map"); }
  app.innerHTML = `
  <section class="hero" style="padding-bottom:16px">
    <div class="eyebrow" style="color:var(--tiger)">Маршрут завершено</div>
    <h2>Вітаємо, ${esc(S.name)}!</h2>
    <p class="lead" style="font-size:16px">Ти ${g("пройшов","пройшла")} шлях Григорія від ешелону до хати тигроловів. Ось твій сертифікат.</p>
  </section>
  <div class="card stack">
    <div id="certBox" class="muted">Готуємо сертифікат…</div>
    <p class="save-tip"><b>Як зберегти:</b> на комп'ютері — клацни по сертифікату правою кнопкою й обери «Зберегти зображення як…»; на телефоні — затисни зображення пальцем або зроби знімок екрана. Надішли його вчителеві.</p>
    <div class="row">
      <button class="btn" id="copy">Скопіювати результат текстом</button>
      <button class="btn ghost" id="mp">Карта</button>
      <button class="btn ghost" id="reset">Почати маршрут заново</button>
    </div>
    <div id="copyMsg" class="small" style="font-weight:700"></div>
  </div>`;
  const url = await drawCert();
  const box = document.getElementById("certBox");
  box.className = ""; box.innerHTML = `<img id="certImg" src="${url}" alt="Сертифікат для ${esc(S.name)}: ${esc(rank())}, іспит ${S.exam.score} з ${EXAM.length}">`;
  document.getElementById("mp").onclick = ()=> go("map");
  document.getElementById("copy").onclick = async ()=>{
    const t = `${S.name}, ${S.cls} клас. Тренажер «Тигролови: маршрут утікача» пройдено. Звання: ${rank()}. Тигрячих слідів: ${totalTracks()} з ${TOTAL_MAX}. Іспит: ${S.exam.score} з ${EXAM.length}. ${fmtDate(S.exam.date)}.`;
    const msg = document.getElementById("copyMsg");
    try{ await navigator.clipboard.writeText(t); msg.textContent="Скопійовано! Встав у чат із вчителем."; }
    catch(e){ msg.textContent = t; }
  };
  const rb = document.getElementById("reset");
  rb.onclick = ()=>{
    if(rb.dataset.sure){ const name=S.name, gender=S.gender, cls=S.cls; S={name,gender,cls,done:{},exam:null}; save(); go("map"); }
    else { rb.dataset.sure="1"; rb.textContent="Точно? Сліди обнуляться — натисни ще раз"; }
  };
}

/* ===================== СНІГ ===================== */
(function(){
  const c = document.getElementById("snow"), ctx = c.getContext("2d");
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let flakes=[], w, h;
  function size(){ w=c.width=innerWidth; h=c.height=innerHeight; flakes = Array.from({length: Math.min(90, Math.round(w/14))}, ()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*2+.6,s:Math.random()*.6+.25,d:Math.random()*Math.PI*2})); }
  function frame(){
    ctx.clearRect(0,0,w,h); ctx.fillStyle="rgba(241,245,243,.55)";
    flakes.forEach(f=>{ ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,Math.PI*2); ctx.fill();
      if(!reduce){ f.y+=f.s; f.d+=.01; f.x+=Math.sin(f.d)*.3; if(f.y>h+4){f.y=-4; f.x=Math.random()*w;} } });
    if(!reduce) requestAnimationFrame(frame);
  }
  addEventListener("resize", ()=>{ size(); if(reduce) frame(); });
  size(); frame();
})();

render(S.name ? "map" : "start");
</script>
