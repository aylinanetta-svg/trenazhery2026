<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тренажери для учнів</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Nunito,system-ui,sans-serif;background:#eef3fb;color:#1d2a3a}
.wrap{max-width:900px;margin:0 auto;padding:28px 16px 60px}
h1{font-size:30px;font-weight:900;margin:0 0 4px}
.lead{color:#5b6b80;margin:0 0 24px}
.subj{background:#fff;border:1px solid #d8e1ee;border-radius:18px;padding:18px 20px;margin-bottom:16px;box-shadow:0 6px 20px rgba(30,60,120,.06)}
.subj h2{margin:0 0 10px;font-size:21px}
.tr{display:flex;flex-wrap:wrap;gap:10px;align-items:center;border-top:1px dashed #d8e1ee;padding:12px 0 2px}
.tr .nm{flex:1;min-width:220px;font-weight:700}
.tr .nm small{display:block;color:#5b6b80;font-weight:400}
a.btn,button.btn{border:none;border-radius:10px;padding:9px 14px;font-weight:800;font-size:14px;cursor:pointer;text-decoration:none;font-family:inherit}
a.btn{background:#2f6fed;color:#fff}
button.btn{background:#fff;color:#2f6fed;border:2px solid #2f6fed}
.empty{color:#8a97a8;font-style:italic}
.ok{color:#1f9d55;font-weight:800;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>📚 Тренажери для учнів</h1>
  <p class="lead">Обери предмет і тренажер. Кнопка «Копіювати посилання» копіює адресу, яку можна надіслати учням.</p>
  <div id="list"></div>
</div>
<script>
/* ===== ЯК ДОДАТИ НОВИЙ ТРЕНАЖЕР =====
   Знайди потрібний предмет і допиши в його квадратні дужки рядок:
   {name:"Назва тренажера", note:"для якого класу", file:"шлях/до/файлу.html"},
   Шлях — це папка/назва файлу так, як на GitHub.                         */
const SUBJECTS = [
  {title:"💻 Інформатика", items:[
    {name:"Інструктаж з БЖД. Брандмауер. Позбуваємось реклами", note:"8 клас", file:"informatyka/Усе з інформатики/bzhd-firewall-reklama-8klas.html"},
  ]},
  {title:"🇺🇦 Українська мова", items:[]},
  {title:"📖 Українська література", items:[]},
  {title:"➗ Алгебра", items:[]},
  {title:"📐 Геометрія", items:[]},
];

const base = location.href.replace(/[^/]*$/, "");
const list = document.getElementById("list");
SUBJECTS.forEach(s=>{
  const d=document.createElement("div");d.className="subj";
  d.innerHTML=`<h2>${s.title}</h2>`;
  if(!s.items.length){d.innerHTML+=`<div class="empty">Тренажери скоро з'являться</div>`;}
  s.items.forEach(t=>{
    const url=base+t.file.split("/").map(encodeURIComponent).join("/");
    const r=document.createElement("div");r.className="tr";
    r.innerHTML=`<div class="nm">${t.name}<small>${t.note||""}</small></div><a class="btn" href="${url}">Відкрити</a><button class="btn">Копіювати посилання</button><span class="ok"></span>`;
    r.querySelector("button").onclick=async()=>{
      try{await navigator.clipboard.writeText(url);r.querySelector(".ok").textContent="✔ Скопійовано";}
      catch(e){prompt("Скопіюйте посилання:",url);}
    };
    d.appendChild(r);
  });
  list.appendChild(d);
});
</script>
</body>
</html>
